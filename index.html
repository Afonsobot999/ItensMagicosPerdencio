<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <style>
        body { 
            font-family: 'Georgia', serif; 
            background-color: #1a1a24; /* Fundo levemente mais místico (azul muito escuro) */
            color: #f4f4f4; 
            margin: 0;
            padding: 40px 20px;
        }
        
        /* Layout Flex para dividir a tela */
        .layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ----- SEÇÃO DO PERSONAGEM (ESQUERDA) ----- */
        .personagem-container {
            flex: 1;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo do balão de fala */
        .balao-fala {
            position: relative;
            background: #eaddc5; /* Cor de pergaminho/papel velho */
            color: #2b2b2b;
            border-radius: 15px;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            font-weight: bold;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            min-height: 150px; /* Espaço reservado para o texto ser digitado */
            border: 2px solid #a68c5b;
        }

        /* O "biquinho" do balão apontando para o Mago */
        .balao-fala::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0 20px;
            border-style: solid;
            border-color: #eaddc5 transparent transparent transparent;
        }

        /* Borda extra para o biquinho combinar com o balão */
        .balao-fala::before {
            content: '';
            position: absolute;
            bottom: -23px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 22px 22px 0 22px;
            border-style: solid;
            border-color: #a68c5b transparent transparent transparent;
            z-index: -1;
        }

        /* Cursor piscante do balão (animação em CSS, sem JavaScript) */
        #cursor {
            animation: piscar 0.8s steps(1) infinite;
        }
        @keyframes piscar {
            50% { opacity: 0; }
        }

        /* Imagem do mago */
        .personagem-imagem {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.9);
            border: 3px solid #3a506b;
        }

        /* ----- SEÇÃO DE ROLAGEM (DIREITA) ----- */
        .container-rolagem { 
            flex: 2;
            box-sizing: border-box;
            background: #2c2c2c; 
            padding: 30px; 
            border-radius: 12px; 
            border: 3px solid #ffd700; 
            box-shadow: 0px 0px 20px rgba(0,0,0,0.9);
            text-align: center;
        }
        
        h1 { 
            color: #ffd700; 
            text-shadow: 2px 2px 4px #000;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            margin-bottom: 25px;
        }
        .botoes { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 30px; 
        }
        button { 
            background-color: #630000; 
            color: white; 
            border: 2px solid #ffd700; 
            padding: 12px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: 0.2s; 
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        button:hover { 
            background-color: #990000; 
            transform: scale(1.05); 
        }
        button.variavel {
            background-color: #3b3b3b;
            border-color: #aaa;
            color: #eee;
        }
        button.variavel:hover {
            background-color: #555;
        }
        #resultado { 
            margin-top: 20px; 
            padding: 40px 20px; 
            background-color: #111; 
            border: 2px dashed #ffd700; 
            border-radius: 8px; 
            min-height: 80px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            font-weight: bold; 
            color: #ffd700;
            text-shadow: 1px 1px 3px #000;
        }
        .raridade-label { 
            font-size: 16px; 
            color: #aaa; 
            margin-top: 15px; 
            font-weight: normal; 
            font-style: italic;
        }
        .contador {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        /* Responsividade para telas menores (celulares) */
        @media (max-width: 850px) {
            .layout {
                flex-direction: column;
                align-items: center;
            }
            .personagem-container {
                width: 100%;
                max-width: 350px;
            }
            .container-rolagem {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>

        function adicionarNaTabela(raridade, nome, doGuia) {
            const tabela = tabelas[raridade];
            if (!tabela) {
                console.warn(`Raridade desconhecida "${raridade}" no item "${nome}"`);
                return;
            }
            const existente = tabela.get(nome);
            if (existente) {
                // O item já estava na lista: não duplica, só atualiza a marcação do Guia
                existente.doGuia = existente.doGuia || doGuia;
            } else {
                tabela.set(nome, { nome, raridade, doGuia });
            }
        }

        // ==========================================
        // LÓGICA DE SORTEIO
        // ==========================================
        const pesoDe = item => item.doGuia ? PESO_GUIA_DO_MESTRE : 1;

        function sortearComPeso(lista) {
            const total = lista.reduce((soma, item) => soma + pesoDe(item), 0);
            let sorte = Math.random() * total;
            for (const item of lista) {
                sorte -= pesoDe(item);
                if (sorte < 0) return item;
            }
            return lista[lista.length - 1];
        }

        function sortearVariavel() {
            const familia = sortearComPeso(itensVariaveis);
            const versoes = Object.entries(familia.versoes || {})
                .flatMap(([raridade, nomes]) => nomes.map(nome => ({ nome, raridade })));

            if (versoes.length === 0) {
                return { nome: familia.nome, raridade: null, doGuia: Boolean(familia.doGuia) };
            }
            const versao = versoes[Math.floor(Math.random() * versoes.length)];
            return {
                nome: versao.nome,
                raridade: versao.raridade,
                doGuia: Boolean(familia.doGuia) || itensDoGuiaDoMestre.has(versao.nome)
            };
        }

        let timeoutRolagem = null;
        let ultimoItem = null;

        function rolarItem(raridade) {
            // Sorteia, tentando não repetir o item anterior
            let resultado;
            for (let tentativa = 0; tentativa < 10; tentativa++) {
                resultado = raridade === 'variavel' ? sortearVariavel() : sortearComPeso(sorteios[raridade]);

            clearTimeout(timeoutRolagem);
